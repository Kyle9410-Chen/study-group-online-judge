name: Publish judge image

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/cerulean-works/study-group-online-judge

jobs:
  publish:
    if: github.repository == 'cerulean-works/study-group-online-judge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: judge
          platforms: linux/amd64
          push: true
          build-args: |
            JUDGE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/cerulean-works/study-group-online-judge:${{ github.sha }}
            ghcr.io/cerulean-works/study-group-online-judge:main
